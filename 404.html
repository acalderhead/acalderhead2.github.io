<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 // acalderhead.github.io</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@100;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:       #0D0D0D;
            --text:     #E0E0E0;
            --muted:    #888888;
            --accent-p: #FF8C00;
            --accent-s: #4682B4;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .error-block { max-width: 480px; }
        .error-code {
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(5rem, 18vw, 9rem);
            font-weight: 700;
            color: var(--accent-p);
            line-height: 1;
            letter-spacing: 4px;
        }
        .error-label {
            font-size: 0.7rem;
            letter-spacing: 0.18em;
            color: var(--accent-s);
            margin-top: 0.5rem;
            text-transform: uppercase;
        }
        .error-msg {
            color: var(--muted);
            font-size: 0.78rem;
            margin-top: 1.5rem;
            line-height: 1.7;
        }
        .home-link {
            display: inline-block;
            margin-top: 2.5rem;
            padding: 0.7rem 2rem;
            border: 1px solid var(--accent-s);
            color: var(--accent-s);
            text-decoration: none;
            font-size: 0.72rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            transition: background 0.25s, color 0.25s;
        }
        .home-link:hover { background: var(--accent-p); color: var(--bg); border-color: var(--accent-p); }
        .divider {
            border: none;
            border-top: 1px solid rgba(70,130,180,0.2);
            margin: 2rem auto;
            width: 60%;
        }
    </style>
</head>
<body>
    <div class="error-block">
        <div class="error-code">404</div>
        <div class="error-label">// FILE_NOT_FOUND</div>
        <hr class="divider">
        <p class="error-msg">
            The requested path does not exist in this environment.<br>
            The node may have moved — or never existed.
        </p>
        <a href="/" class="home-link">↩ Return to base</a>
    </div>
</body>
</html>
